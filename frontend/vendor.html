<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation to Quote</title>

    <link href="vendor.css?v=6" rel="stylesheet">
</head>
<body>
    <div class="toasts" id="toasts"></div>

    <header class="masthead">
        <div class="masthead-inner">
            <span class="wordmark">TenderFlow</span>
            <span class="masthead-note">Invitation to quote</span>

    </header>

    <main id="page">
        <div class="loading">
            <div class="spinner"></div>

        </div>

    <footer class="footer">
        <p>This link was addressed to your company. If you weren't expecting it, please contact the purchasing team who sent it.</p>
    </footer>

    <script src="vendor.js?v=6"></script>

</html>

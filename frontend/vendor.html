<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation to Quote</title>

    <!-- Deliberately standalone. This page shares no HTML, CSS or JavaScript
         with the internal application: a vendor is outside the company, and
         serving them index.html meant serving them every screen, every role
         check and every endpoint name the staff app uses. They only ever
         needed one form.

         Nothing is loaded from a CDN either. A vendor on a bad connection is
         still a vendor with a deadline, and an icon font that fails to arrive
         should not be able to make a price field hard to find. -->
    <link href="vendor.css?v=5" rel="stylesheet">
</head>
<body>
    <div class="toasts" id="toasts"></div>

    <header class="masthead">
        <div class="masthead-inner">
            <span class="wordmark">TenderFlow</span>
            <span class="masthead-note">Invitation to quote</span>
        </div>
    </header>

    <main id="page">
        <div class="loading">
            <div class="spinner"></div>
            <p>Opening your invitation…</p>
        </div>
    </main>

    <footer class="footer">
        <p>This link was addressed to your company. If you weren't expecting it, please contact the purchasing team who sent it.</p>
    </footer>

    <script src="vendor.js?v=5"></script>
</body>
</html>
